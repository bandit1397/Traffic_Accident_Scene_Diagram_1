<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>교통사고 현장약도</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#333333">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="현장약도">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/car.png">

<!-- ===== OpenStreetMap (Leaflet) ===== -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
body {
  margin:0;
  background:#eee;
  font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}

/* A4 비율(210:297)을 유지하면서 화면 폭에 맞춰 축소 */
#container {
  position: relative;
  width: min(210mm, 100vw);
  aspect-ratio: 210 / 297;
  height: auto;
  margin: 0 auto;
  padding: 4vw;                /* 화면 크기에 비례한 여백 */
  background: #fff;
  border: 1px solid #000;
  box-sizing: border-box;
}
@media (min-width: 800px){
  #container { padding: 15mm; }
}


#container { display:flex; flex-direction:column; }

/* 상단 제목 영역 / 하단 여백 영역 — 같은 높이(A4 세로의 12%씩).
   두 영역 모두 사건 관련 객체(문자·메모 등)를 올릴 수 있는 흰 여백. */
h1, #bottomArea {
  flex: 0 0 12%;
  margin: 0;
  position: relative;
}
h1 {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: clamp(14px, 4vw, 18px);
  font-weight: 700;
}

#map {
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  border: 1px solid #000;
  position: relative;
  overflow: hidden;
}

/* ===== 카카오 지도 이미지 ===== */
#bgMap {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  z-index:1;
}

/* ===== 배경 지도 (Leaflet OSM / 카카오) =====
   표시 여부는 JS(startOsmNav / initKakaoMap 경로)에서 직접 제어.
   같은 자리에 겹치면 위쪽 빈 div가 이벤트를 먹으므로 반드시 하나만 block. */
#osmMap {
  position:absolute;
  inset:0;
  z-index:300;          /* bgMap(1) 위, lineLayer(400) 아래 */
  display:none;
}
#kakaoMap {
  position:absolute;
  inset:0;
  z-index:300;
  display:none;
}

/* 지도 탐색 모드: 프레임(#map) 안에서 그대로 조작 (WYSIWYG).
   화면에 보이는 그대로가 변환/캡처 배경이 됨.
   선 레이어는 이벤트를 통과시켜 지도 드래그·확대가 되도록 함. */
#map.navigating #lineLayer { pointer-events:none !important; }

/* ===== 배경 출처 표기 (PDF에 포함) ===== */
#bgAttribution {
  position:absolute;
  right:3px;
  bottom:2px;
  z-index:350;
  font-size:10px;
  line-height:1.2;
  color:#222;
  background:rgba(255,255,255,0.72);
  padding:1px 4px;
  border-radius:3px;
  pointer-events:none;
  max-width:90%;
  display:none;
}

/* ===== 지도 안내 문구 ===== */
#mapHint {
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  z-index:600;
  display:none;
  background:rgba(0,0,0,0.72);
  color:#fff;
  font-size:12px;
  padding:5px 10px;
  border-radius:14px;
  max-width:92%;
  text-align:center;
}
#map.navigating #mapHint { display:block; }

/* ===== 충돌지점 X (SVG — 다른 객체처럼 width 로 크기 조절) ===== */
.xmark {
  position:absolute;
  z-index:1000;
  cursor:move;
  user-select:none;
  overflow:visible;
  display:block;
}

/* ===== PDF 결과 바 ===== */
#pdfResultBar {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:5000;
  display:none;
  background:#111;
  color:#fff;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 8px rgba(0,0,0,0.35);
  font-size:13px;
}
#pdfResultBar .fname {
  display:block;
  margin-bottom:8px;
  word-break:break-all;
  opacity:0.9;
}
#pdfResultBar .row { display:flex; gap:8px; }
#pdfResultBar button {
  flex:1;
  min-height:44px;
  font-size:15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
#pdfShareBtn { background:#1a7f37; color:#fff; }
#pdfSaveBtn  { background:#fff; color:#111; }
#pdfCloseBtn {
  flex:0 0 44px;
  background:#333;
  color:#fff;
}

/* ===== 토스트 ===== */
#toast {
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  z-index:6000;
  background:rgba(0,0,0,0.85);
  color:#fff;
  font-size:13px;
  padding:8px 14px;
  border-radius:16px;
  max-width:90%;
  text-align:center;
  opacity:0;
  transition:opacity 0.25s;
  pointer-events:none;
}
#toast.show { opacity:1; }

/* ===== 지도 검색 바 ===== */
#mapNavBar {
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:600;
  display:none;
  gap:4px;
  align-items:center;
  background:rgba(255,255,255,0.95);
  border:1px solid #333;
  border-radius:8px;
  padding:5px 6px;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
  max-width:94%;
  flex-wrap:wrap;
  justify-content:center;
  touch-action:none;          /* 빈 영역·그립을 잡고 드래그 */
}
#map.navigating #mapNavBar { display:flex; }

/* 컨트롤은 기본 터치 동작 유지 */
#mapNavBar input, #mapNavBar button, #mapNavBar select { touch-action:auto; }

/* 검색 바 드래그 손잡이 */
#mapNavGrip {
  cursor:move;
  touch-action:none;
  user-select:none;
  align-self:stretch;
  display:flex;
  align-items:center;
  padding:2px 3px;
  font-size:16px;
  line-height:1;
  letter-spacing:-2px;
  color:#555;
}
#mapNavGrip:active { color:#000; }

#mapNavBar input {
  width:160px;
  font-size:13px;
  padding:3px 5px;
}
#mapNavBar button {
  font-size:13px;
  padding:3px 8px;
  cursor:pointer;
}
#mapNavBar select {
  font-size:13px;
  padding:3px 4px;
  cursor:pointer;
}
#confirmBgBtn {
  background:#1a7f37;
  color:#fff;
  border:none;
  border-radius:4px;
}
#autoMapBtn {
  background:#1461b8;
  color:#fff;
  border:none;
  border-radius:4px;
}

#lineLayer {
  position:absolute;
  inset:0;
  z-index:400;
  touch-action:none;
  pointer-events:auto;
}

/* ===== 자유곡선 캔버스 ===== */
#drawCanvas {
  position:absolute;
  inset:0;
  z-index:500;
}

/* ===== 객체 ===== */
.icon, .arrow {
  position:absolute;
  cursor:move;
  z-index:1000;
}

/* ===== 객체 전용 레이어 (map 밖 허용) ===== */
#objectLayer{
  position:absolute;
  inset:0;
  z-index:2000;
  pointer-events:none;   /* 기본 통과 */
}

#objectLayer .icon,
#objectLayer .arrow,
#objectLayer .textbox,
#objectLayer .xmark,
#objectLayer .crosswalk{
  pointer-events:auto;   /* 객체만 이벤트 */
}

/* ===== 반투명 횡단보도 (SVG — 다른 객체처럼 크기·회전·이동) ===== */
.crosswalk{
  position:absolute;
  z-index:900;            /* 지도 위, 다른 객체 아래(가리지 않게) */
  cursor:move;
  user-select:none;
  display:block;
  opacity:0.75;
}

.arrow { transform-origin:center; }

.textbox {
  position:absolute;
  border:1px solid transparent;
  background:#fff;
  padding:2px 4px;
  cursor:move;
  z-index:1000;

  resize:none;          /* ⭐ 제거 */
  white-space:nowrap;  /* ⭐ 한 줄 유지 */
}

/* ===== 속성 패널 ===== */
#panel {
  position:fixed;              /* 화면에 고정 → 도면을 스크롤해도 항상 접근 가능 */
  left:50%;
  top:40%;
  transform:translate(-50%, -50%);
  background:#fff;
  border:1px solid #333;
  border-radius:4px;
  padding:10px;
  width:210px;
  max-width:calc(100vw - 16px);
  visibility:hidden;
  opacity:0;
  z-index:3500;               /* 도구패널(4000)보다 낮지만 객체보다 위 */
  box-shadow:0 4px 16px rgba(0,0,0,0.28);
  touch-action:none;          /* 빈 영역을 잡고 드래그 */
}

/* 헤더 = 드래그 바 (손가락으로 잡기 쉽게 크고 뚜렷하게) */
#panelHeader {
  font-weight:bold;
  margin:-10px -10px 8px -10px;
  padding:11px 12px;
  background:#333;
  color:#fff;
  cursor:move;
  user-select:none;
  border-radius:3px 3px 0 0;
  touch-action:none;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
}
#panelHeader::before {
  content:"⠿⠿";
  letter-spacing:-2px;
  opacity:0.75;
  font-size:15px;
}

/* 슬라이더·버튼은 기본 터치 동작 유지 */
#panel input, #panel button, #panel select {
  touch-action:auto;
}

#panel label {
  font-size:12px;
  display:block;
  margin-top:6px;
}

#panel input[type="range"]{
  width:100%;
}

.rangeWrap{
  display:flex;
  align-items:center;
  gap:4px;
}

.stepBtn{
  width:22px;
  height:22px;
  font-size:16px;
  line-height:20px;
  padding:0;
  cursor:pointer;
}

/* ===== 도구 패널 ===== */
#toolbox {
  position:absolute;
  top:10px;
  left:10px;
  z-index:4000;
}

#toolToggle {
  width:44px;
  height:44px;
  font-size:22px;
  border-radius:8px;
  background:#333;
  color:#fff;
  border:none;
}

#toolContent {
  display:none;
  margin-top:6px;
  background:#fff;
  border:1px solid #333;
  border-radius:10px;
  padding:6px;
  width:120px;

  max-height: 70vh;
  overflow-y: auto;
  overscroll-behavior: contain;

  padding-bottom: 16px;        /* ✅ PC 스크롤 잘림 방지 */
  box-sizing: border-box;      /* ✅ 높이 계산 정확화 */
}


#toolContent button {
  width:100%;
  min-height:32px;
  margin:2px 0;
  font-size:13px;
}

#toolContent label {
  font-size:12px;
  display:block;
  margin-top:4px;
}

#toolContent hr {
  margin:6px 0;
}
.subToggle{
  width:100%;
  min-height:32px;
  margin:2px 0;
  font-size:13px;
  text-align:left;
}

.subMenu{
  display:none;
  padding-left:8px;
}

.subMenu button{
  font-size:12px;
}

</style>
</head>

<body>

<div id="container">
  <h1>교통사고 현장약도</h1>

  <div id="map">


    <!-- 배경 지도 이미지 (지도 확정 시 여기에 구워 넣음) -->
    <img id="bgMap"
       src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
       alt=""
       style="
         position:absolute;
         inset:0;
         width:100%;
         height:100%;
         object-fit:cover;   /* ⭐ contain → cover 변경 */
         z-index:1;
         pointer-events:none;
       ">

    <!-- OpenStreetMap 실시간 지도 (배경 위치 잡기용, 키 불필요) -->
    <div id="osmMap"></div>

    <!-- 카카오맵 (KAKAO_JS_KEY 입력 시 사용, 화면 위치잡기 전용) -->
    <div id="kakaoMap"></div>

    <!-- 배경 출처 표기 (배경 확정 시 표시, PDF에 포함) -->
    <div id="bgAttribution"></div>

    <!-- 지도 검색 바 -->
    <div id="mapNavBar">
      <span id="mapNavGrip" title="드래그하여 패널 이동">⠿</span>
      <input id="placeSearch" type="text" placeholder="주소·장소 검색 후 Enter">
      <button id="searchBtn" type="button">검색</button>
      <select id="mapStyleSel" title="지도 스타일"></select>
      <button id="autoMapBtn" type="button" title="현재 화면의 도로·건물을 약도로 자동 생성">🛣️ 도로 약도</button>
      <button id="shotBgBtn" type="button" title="폰 스크린샷 불러오기">📷 스크린샷</button>
      <button id="confirmBgBtn" type="button">현재 화면 배경</button>
      <button id="closeMapBtn" type="button" title="지도 닫기">✕</button>
    </div>

    <!-- 지도 조작 안내 -->
    <div id="mapHint"></div>


    <!-- 🟢 실선 / 점선용 SVG (좌표 정확) — 스타일은 CSS(#lineLayer)에서 관리.
         지도 탐색 중에는 CSS가 pointer-events:none 으로 바꿔 지도 조작이 통과되게 함 -->
    <svg id="lineLayer" width="100%" height="100%"></svg>

  </div>

  <!-- 하단 여백 (상단 제목 영역과 같은 높이) — 사건 관련 객체·메모 배치 공간 -->
  <div id="bottomArea"></div>

  <div id="objectLayer"></div>

    <!-- ④ 속성 패널 -->
    <div id="panel">

      <div id="panelHeader">선택 객체</div>

      <label>각도
        <div class="rangeWrap">
          <button class="stepBtn" data-target="angle" data-step="-0.2">−</button>
          <input id="angle" type="range" min="-180" max="180" step="0.2" value="0">
          <button class="stepBtn" data-target="angle" data-step="0.2">+</button>
        </div>
      </label>
      <label>크기
        <input id="size" type="range" min="10" max="400" value="32">
      </label>
      <label>글자크기
        <input id="fontSize" type="range" min="8" max="48" value="14">
      </label>
      <label>폭
        <input id="width" type="range" min="10" max="500" value="60">
      </label>
    </div>


    <!-- 도구 -->
    <!-- 도구 -->
    <div id="toolbox">
      <button id="toolToggle">☰</button>

      <div id="toolContent">

        <!-- ===== 객체 ===== -->
        <button onclick="togglePanel()">객체패널</button>
        <button onclick="addIcon('person')">사람</button>
        <button onclick="addIcon('car')">자동차</button>
        <button onclick="addIcon('bike')">자전거</button>

        <!-- ===== 오토바이 하위 토글 ===== -->
        <button class="subToggle" onclick="toggleSub('motoMenu')">▶ 오토바이</button>
        <div id="motoMenu" class="subMenu">
          <button onclick="addMoto(0)">오토바이①</button>
          <button onclick="addMoto(1)">오토바이②</button>
          <button onclick="addMoto(2)">오토바이③</button>
        </div>

        <!-- ===== 화살표 하위 토글 ===== -->
        <button class="subToggle" onclick="toggleSub('arrowMenu')">▶ 화살표</button>
        <div id="arrowMenu" class="subMenu">
          <button onclick="addArrow(0)">화살표①</button>
          <button onclick="addArrow(1)">화살표②</button>
          <button onclick="addArrow(2)">화살표③</button>
          <button onclick="addArrow(3)">화살표④</button>
          <button onclick="addArrow(4)">화살표⑤</button>
        </div>

        <button onclick="addText()">문자</button>
        <button onclick="addX()">✕ 충돌지점</button>
        <button onclick="addCrosswalk()">▦ 횡단보도</button>
        <button onclick="startMeasure()">↔ 정차·거리</button>
        <button onclick="clearMeasures()">↔ 측정선 지우기</button>

        <hr>

        <!-- ===== 선색 / 굵기 ===== -->
        <label>
          선색
          <input type="color" id="lineColor" value="#ff0000">
        </label>

        <label>
          굵기
          <input type="range" id="lineWidth" min="1" max="15" value="3">
        </label>

        <hr>

        <!-- ===== 선 하위 토글 ===== -->
        <button class="subToggle" onclick="toggleSub('lineMenu')">▶ 선</button>

        <div id="lineMenu" class="subMenu">

          <b style="font-size:12px;">선 선택</b>
          <button onclick="setLineMode('solid')">실선 선택</button>
          <button onclick="setLineMode('dashed')">점선 선택</button>
          <button onclick="setLineMode(null)">선 해제</button>

          <hr>

          <b style="font-size:12px;">선 이동</b>
          <button onclick="setMoveMode('solid')">실선 이동</button>
          <button onclick="setMoveMode('dashed')">점선 이동</button>

          <hr>

          <b style="font-size:12px;">선 삭제</b>
          <button onclick="setDeleteMode('solid')">실선 삭제</button>
          <button onclick="setDeleteMode('dashed')">점선 삭제</button>

          <hr>

          <b style="font-size:12px;">선 회전 기준</b>
          <button onclick="lineRotateAnchor='start'">좌측 기준</button>
          <button onclick="lineRotateAnchor='end'">우측 기준</button>

        </div>

        <hr>

        <!-- ===== 배경 지도 ===== -->
        <b style="font-size:12px;">배경 지도</b>
        <button onclick="openMapNav()">🗺️ 지도 열기 / 위치 변경</button>

        <hr>

        <!-- ===== 배경 이미지 (폰 스크린샷 등) ===== -->
        <label style="font-size:12px; display:block; margin-top:6px;">
          폰 스크린샷·사진 불러오기
          <input type="file" id="bgInput" accept="image/*">
        </label>

        <hr>

        <button onclick="savePDF()" style="background:#1a7f37;color:#fff;">📄 PDF 만들기</button>

      </div>
    </div>

  </div>

  <!-- ===== PDF 생성 결과 바 ===== -->
  <div id="pdfResultBar">
    <span class="fname" id="pdfFname"></span>
    <div class="row">
      <button id="pdfShareBtn" type="button">PDF 공유</button>
      <button id="pdfSaveBtn" type="button">PDF 저장</button>
      <button id="pdfCloseBtn" type="button" title="닫기">✕</button>
    </div>
  </div>

  <div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
/* =========================================================================
   설정 — 카카오맵을 프레임 안 "위치잡기 지도"로 쓰려면 아래에
   카카오 JavaScript 키를 넣으세요. (예: "abcd1234...")
   비워두면 키가 필요 없는 OpenStreetMap 이 사용됩니다.

   ※ 카카오 지도 이미지는 정책상 PDF 로 저장·공유할 수 없으므로,
     카카오맵은 화면에서 위치를 확인하는 용도로만 쓰고,
     배경은 "📷 스크린샷" 으로 폰 캡처를 불러오세요.
   ========================================================================= */

async function cropImageToMapCover(imgEl, mapEl, outScale = 2){
  // map 크기(화면 px 기준)
  const r = mapEl.getBoundingClientRect();
  const cw = Math.round(r.width);
  const ch = Math.round(r.height);

  // 원본 이미지 실제 크기
  const iw = imgEl.naturalWidth;
  const ih = imgEl.naturalHeight;

  // "cover" 스케일 (컨테이너를 꽉 채우는 스케일)
  const scale = Math.max(cw / iw, ch / ih);

  // 컨테이너에 보이는 영역이 원본에서 차지하는 크기(소스 좌표)
  const srcW = cw / scale;
  const srcH = ch / scale;

  // 중앙 크롭(원본 가운데를 기준으로)
  const sx = (iw - srcW) / 2;
  const sy = (ih - srcH) / 2;

  // 출력 캔버스(해상도 outScale로 올리면 PDF 더 선명)
  const canvas = document.createElement('canvas');
  canvas.width  = cw * outScale;
  canvas.height = ch * outScale;

  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;

  // 원본에서 sx,sy,srcW,srcH만 잘라서
  // 출력 캔버스 전체로 확대해서 그림
  ctx.drawImage(
    imgEl,
    sx, sy, srcW, srcH,
    0, 0, canvas.width, canvas.height
  );

  return canvas.toDataURL('image/jpeg', 0.95); // png도 가능
}

function enableDeleteConfirmation(el) {
    let touchTimer = null;
    let startX = 0, startY = 0;
    let moved = false;
    const MOVE_THRESHOLD = 6; // ⭐ 이 거리 이상 움직이면 "이동"으로 판단

    // PC: 더블클릭 삭제 (기존 그대로)
    el.addEventListener('dblclick', e => {
        e.preventDefault();
        if(confirm('이 객체를 삭제하시겠습니까?')) {
            el.remove();
            if(selected === el){
                selected = null;
                panel.style.visibility = 'hidden';
                panel.style.opacity = '0';
            }
        }
    });

    // 모바일: 길게 누르기 시작
    el.addEventListener('pointerdown', e => {
        if(e.pointerType !== 'touch') return;

        startX = e.clientX;
        startY = e.clientY;
        moved = false;

        touchTimer = setTimeout(() => {
            if(moved) return; // ⭐ 이동 중이면 삭제 금지

            if(confirm('이 객체를 삭제하시겠습니까?')) {
                el.remove();
                if(selected === el){
                    selected = null;
                    panel.style.visibility = 'hidden';
                    panel.style.opacity = '0';
                }
            }
        }, 700);
    });

    // ⭐ 이동 감지 → 삭제 타이머 취소
    el.addEventListener('pointermove', e => {
        if(!touchTimer) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if(Math.hypot(dx, dy) > MOVE_THRESHOLD) {
            moved = true;
            clearTimeout(touchTimer);
            touchTimer = null;
        }
    });

    // 터치 종료 / 취소
    el.addEventListener('pointerup', () => {
        if(touchTimer){
            clearTimeout(touchTimer);
            touchTimer = null;
        }
    });

    el.addEventListener('pointercancel', () => {
        if(touchTimer){
            clearTimeout(touchTimer);
            touchTimer = null;
        }
    });
}

/* ===== 선(SVG) 시스템 ===== */
const svg = document.getElementById('lineLayer');

let lineMode = null;     // 'solid' | 'dashed' | null
let moveMode = null;
let deleteMode = null;

let startPoint = null;
let selectedLine = null;
let dragOffset = {x:0,y:0};

/* ===== 선 모드 제어 ===== */

/* ===== 선 입력 이벤트 (← 바로 다음에 질문한 코드가 옴) ===== */
svg.addEventListener('pointerdown', e=>{
  const pt = getSVGPoint(e);

  /* ===== 생성 ===== */
  if(lineMode){
    if(!startPoint){
      startPoint = pt;
    }else{
      createLine(startPoint, pt, lineMode);
      startPoint = null;
    }
  }

  /* ===== 삭제 ===== */
  if(deleteMode){
    const line = findNearestLine(pt, deleteMode);
    if(line) svg.removeChild(line);
  }

  /* ===== 이동 시작 ===== */
  if(moveMode){
    const line = findNearestLine(pt, moveMode);
    if(line){
      selectedLine = line;
      dragOffset = {
        x: pt.x - line.x1.baseVal.value,
        y: pt.y - line.y1.baseVal.value
      };
      svg.setPointerCapture(e.pointerId);
    }
  }
  // 선 선택
  if(!lineMode && !moveMode && !deleteMode){
    const line = findNearestLine(pt, 'solid') || findNearestLine(pt, 'dashed');
    if(line) select(line);
  }
});

/* ===== 선 이동 ===== */
svg.addEventListener('pointermove', e=>{
  if(!selectedLine) return;

  const pt = getSVGPoint(e);
  const dx = pt.x - dragOffset.x;
  const dy = pt.y - dragOffset.y;

  const w = selectedLine.x2.baseVal.value - selectedLine.x1.baseVal.value;
  const h = selectedLine.y2.baseVal.value - selectedLine.y1.baseVal.value;

  selectedLine.setAttribute('x1', dx);
  selectedLine.setAttribute('y1', dy);
  selectedLine.setAttribute('x2', dx + w);
  selectedLine.setAttribute('y2', dy + h);
});

/* ===== 이동 종료 ===== */
svg.addEventListener('pointerup', ()=>{
  selectedLine = null;
});

/* ===== 좌표 변환 ===== */
function getSVGPoint(e){
  const r = svg.getBoundingClientRect();
  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top
  };
}  

/* ===== 선 생성 ===== */
function createLine(p1, p2, type){
  const line = document.createElementNS(
    'http://www.w3.org/2000/svg',
    'line'
  );

  line.setAttribute('x1', p1.x);
  line.setAttribute('y1', p1.y);
  line.setAttribute('x2', p2.x);
  line.setAttribute('y2', p2.y);
  line.setAttribute('stroke', currentLineColor);
  line.setAttribute('stroke-width', currentLineWidth);
  line.setAttribute('stroke-linecap', 'round');

  if(type === 'dashed'){
    line.setAttribute('stroke-dasharray', '8 6');
  }

  line.dataset.type = type;
  svg.appendChild(line);
}

document.getElementById('lineWidth').addEventListener('input', e=>{
  currentLineWidth = e.target.value;
  if(selected && selected.tagName === 'line'){
    selected.setAttribute('stroke-width', currentLineWidth);
  }
});

document.getElementById('lineColor').addEventListener('input', e=>{
  currentLineColor = e.target.value;
  if(selected && selected.tagName === 'line'){
    selected.setAttribute('stroke', currentLineColor);
  }
});


/* ===== 가장 가까운 선 찾기 ===== */
function findNearestLine(pt, type){
  let min = 15;
  let target = null;

  [...svg.children].forEach(l=>{
    if(l.dataset.type !== type) return;
    const d = pointLineDistance(pt, l);
    if(d < min){
      min = d;
      target = l;
    }
  });
  return target;
}

/* ===== 점-선 거리 계산 ===== */
function pointLineDistance(p, l){
  const x1=l.x1.baseVal.value, y1=l.y1.baseVal.value;
  const x2=l.x2.baseVal.value, y2=l.y2.baseVal.value;
  const A=p.x-x1, B=p.y-y1, C=x2-x1, D=y2-y1;
  const dot=A*C+B*D;
  const len=C*C+D*D;
  const t=Math.max(0,Math.min(1,dot/len));
  const x=x1+t*C, y=y1+t*D;
  return Math.hypot(p.x-x,p.y-y);
}
  
function togglePanel(){

/* ===== 속성 패널 드래그 (모바일·PC 공통, 자유 이동) =====
   헤더 바 또는 패널의 빈 영역을 잡고 끌면 이동. 슬라이더·버튼 위에서 시작하면 무시.
   화면 밖으로 완전히 사라지지 않도록 뷰포트 기준으로 클램프. */
function makePanelDraggable(panel){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;

  panel.addEventListener('pointerdown', e=>{
    if(e.target.closest('input, button, select, textarea')) return;   // 컨트롤 조작은 그대로
    const pR = panel.getBoundingClientRect();                         // position:fixed → 뷰포트 좌표
    panel.style.transform = 'none';
    ox = pR.left;
    oy = pR.top;
    panel.style.left = ox + 'px';
    panel.style.top  = oy + 'px';
    sx = e.clientX; sy = e.clientY;
    dragging = true;
    panel.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  panel.addEventListener('pointermove', e=>{
    if(!dragging) return;
    let nx = ox + e.clientX - sx;
    let ny = oy + e.clientY - sy;
    panel.style.left = nx + 'px';
    panel.style.top  = ny + 'px';

    // 뷰포트 밖으로 완전히 나가지 않도록 보정 (헤더는 항상 잡을 수 있게)
    const b = panel.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    let dx = 0, dy = 0;
    if(b.top < 4)                 dy = 4 - b.top;
    else if(b.top > vh - 44)      dy = (vh - 44) - b.top;
    if(b.left > vw - 60)          dx = (vw - 60) - b.left;
    else if(b.right < 60)         dx = 60 - b.right;
    if(dx || dy){
      panel.style.left = (nx + dx) + 'px';
      panel.style.top  = (ny + dy) + 'px';
    }
  });

  const end = e=>{
    dragging = false;
    try{ panel.releasePointerCapture(e.pointerId); }catch(_){}
  };
  panel.addEventListener('pointerup', end);
  panel.addEventListener('pointercancel', end);
}

makePanelDraggable(panel);


/* ===== 지도 검색 바(#mapNavBar) 자유 이동 =====
   그립(⠿) 또는 바의 빈 영역을 잡고 끌면 이동. 입력·버튼·선택 조작은 그대로.
   #mapNavBar 는 #map 안의 position:absolute → left/top(px, #map 기준)로 이동.
   지도 프레임 밖으로 완전히 나가지 않도록 클램프. */
function makeMapBarDraggable(bar, grip){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  const mapEl = document.getElementById('map');

  bar.addEventListener('pointerdown', e=>{
    // 그립이 아니고 컨트롤 위에서 시작했으면 무시 (검색·버튼 정상 동작)
    if(e.target !== grip && e.target.closest('input, button, select, textarea')) return;

    const bR = bar.getBoundingClientRect();
    const mR = mapEl.getBoundingClientRect();
    bar.style.transform = 'none';
    ox = bR.left - mR.left;
    oy = bR.top  - mR.top;
    bar.style.left = ox + 'px';
    bar.style.top  = oy + 'px';
    sx = e.clientX; sy = e.clientY;
    dragging = true;
    try{ bar.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });

  bar.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const mW = mapEl.clientWidth, mH = mapEl.clientHeight;
    const bW = bar.offsetWidth,   bH = bar.offsetHeight;
    const KEEP = 48;   // 화면에 항상 남길 최소 크기
    let nx = ox + e.clientX - sx;
    let ny = oy + e.clientY - sy;
    nx = Math.max(KEEP - bW, Math.min(mW - KEEP, nx));
    ny = Math.max(0,          Math.min(mH - Math.min(bH, 40), ny));
    bar.style.left = nx + 'px';
    bar.style.top  = ny + 'px';
  });

  const end = e=>{
    dragging = false;
    try{ bar.releasePointerCapture(e.pointerId); }catch(_){}
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
}
makeMapBarDraggable(
  document.getElementById('mapNavBar'),
  document.getElementById('mapNavGrip')
);

let selected=null;
let panelInitialized = false;
function centerPos(){
  // 객체는 objectLayer(컨테이너 전체) 좌표계에 놓이므로 지도 프레임의 오프셋을 반영
  const m = mapDiv.getBoundingClientRect();
  const c = objectLayer.getBoundingClientRect();
  return { x: (m.left - c.left) + m.width/2 - 16,
           y: (m.top  - c.top ) + m.height/2 - 16 };
}

function select(el){
  if(el === panel) return;
  selected = el;

  // 선이면 패널 슬라이더 연동
  if(el.tagName === 'line'){
    // 색상/굵기 패널 슬라이더 값 업데이트
    document.getElementById('lineColor').value = el.getAttribute('stroke');
    document.getElementById('lineWidth').value = el.getAttribute('stroke-width');
  }

  if(!panelInitialized){
    // 뷰포트 우측 상단 근처에 첫 배치 (도면을 가리지 않게), position:fixed 기준
    const w = panel.offsetWidth || 210;
    panel.style.left = Math.max(8, window.innerWidth - w - 12) + 'px';
    panel.style.top  = '72px';
    panel.style.transform = 'none';
    panelInitialized = true;
  }

  panel.style.visibility = 'visible';
  panel.style.opacity = '1';
}




/* ===== 드래그 ===== */
function drag(handle, target = handle){
  let sx = 0, sy = 0, ox = 0, oy = 0;
  let dragging = false;

  handle.style.touchAction = 'none';

  handle.addEventListener('pointerdown', e=>{

    if(target === panel && panel.style.transform){
      panel.style.transform = 'none';
    }

    if(typeof select === 'function'){
      select(target);
    }

    if(target.classList.contains('textbox') && target.isEditing){
      return;
    }

    dragging = true;
    sx = e.clientX;
    sy = e.clientY;
    ox = parseFloat(target.style.left) || 0;
    oy = parseFloat(target.style.top)  || 0;

    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });


  handle.addEventListener('pointermove', e=>{
    if(!dragging) return;

    target.style.left = (ox + e.clientX - sx) + 'px';
    target.style.top  = (oy + e.clientY - sy) + 'px';
  });

  handle.addEventListener('pointerup', e=>{
    dragging = false;
    handle.releasePointerCapture(e.pointerId);
  });

  handle.addEventListener('pointercancel', e=>{
    dragging = false;
    handle.releasePointerCapture(e.pointerId);
  });
}

let touchMoved = false;

t.addEventListener('pointerdown', () => {

});

t.addEventListener('pointermove', () => {
  touchMoved = true;   // 이동하면 편집 취소

  // 모바일에서 편집 시작
  t.isEditing = true;

  t.focus();
  adjustSize();

  // 모바일 키보드 확실히 띄우기
  setTimeout(() => {
    t.setSelectionRange(t.value.length, t.value.length);
  }, 0);
});


  /* 🔹 자동 폭 계산 */
  const adjustSize = ()=>{
    t.style.width = '1px';
    t.style.width = (t.scrollWidth + 6) + 'px';
  };

  /* 🔹 더블클릭 → 편집 */
  t.addEventListener('dblclick', ()=>{
    t.isEditing = true;
    t.readOnly = false;
    t.focus();
    adjustSize();
  });

  /* 🔹 입력 중 자동 확대 */
  t.addEventListener('input', adjustSize);

  /* 🔹 포커스 해제 → 이동 */
  t.addEventListener('blur', ()=>{
    t.isEditing = false;
    t.readOnly = true;
    t.style.borderColor = 'transparent';
    adjustSize();
  });

  /* 🔹 폰트 슬라이더 연동 */
  const fontInput = document.getElementById('fontSize');
  fontInput.addEventListener('input', ()=>{
    if(selected === t){
      t.style.fontSize = fontInput.value + 'px';

    }
  });

}

/* ===== 충돌지점 X ===== */
function addX(){

/* ===== 반투명 횡단보도 ===== */
const CROSSWALK_RATIO = 0.55;   // 세로/가로 비율
function addCrosswalk(){
  const p = centerPos();
  const NS = 'http://www.w3.org/2000/svg';
  const cw = document.createElementNS(NS, 'svg');
  cw.setAttribute('class', 'crosswalk');
  cw.setAttribute('viewBox', '0 0 100 55');
  cw.setAttribute('preserveAspectRatio', 'none');
  // 흰 줄무늬 6개 (반투명은 CSS opacity 로)
  let bars = '';
  for(let i = 0; i < 6; i++){
    const x = 4 + i * 16;
    bars += '<rect x="' + x + '" y="2" width="10" height="51" fill="#ffffff" '
          + 'stroke="#333" stroke-width="1"/>';
  }
  cw.innerHTML = bars;
  cw.style.left = p.x + 'px';
  cw.style.top  = p.y + 'px';
  cw.style.width  = '140px';
  cw.style.height = (140 * CROSSWALK_RATIO) + 'px';
  objectLayer.appendChild(cw);
  drag(cw);
  enableDeleteConfirmation(cw);
  select(cw);
  toast('횡단보도 — 드래그로 이동, 크기·각도 슬라이더로 조절');
}

/* ===== 정차위치·거리 측정선 ===== */
/*  지도(프레임)를 두 번 탭 → 양끝 화살표 선 + 실측 거리 라벨(직접 입력) */
let measureArm = false;
let measureStart = null;

function startMeasure(){
  measureArm = true;
  measureStart = null;
  toolContent.style.display = 'none';
  toast('시작점과 끝점을 차례로 탭하세요');
}

svg.addEventListener('pointerdown', e=>{
  if(!measureArm) return;
  const pt = getSVGPoint(e);
  if(!measureStart){
    measureStart = pt;
    toast('끝점을 탭하세요');
  }else{
    createMeasure(measureStart, pt);
    measureArm = false;
    measureStart = null;
  }
});

function createMeasure(p1, p2){
  const NS = 'http://www.w3.org/2000/svg';

  // 화살촉 마커 정의 (한 번만)
  if(!svg.querySelector('#measureArrow')){
    const defs = document.createElementNS(NS, 'defs');
    defs.innerHTML =
      '<marker id="measureArrow" viewBox="0 0 10 10" refX="9" refY="5" ' +
      'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="#c00"/></marker>';
    svg.appendChild(defs);
  }

  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
  line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
  line.setAttribute('stroke', '#c00');
  line.setAttribute('stroke-width', 2);
  line.setAttribute('marker-start', 'url(#measureArrow)');
  line.setAttribute('marker-end', 'url(#measureArrow)');
  line.dataset.type = 'measure';
  svg.appendChild(line);

  // 가운데에 편집 가능한 거리 라벨 (사용자가 실측값 입력)
  // p1/p2 는 lineLayer 좌표 → objectLayer 좌표로 변환
  const svgR = svg.getBoundingClientRect();
  const c = objectLayer.getBoundingClientRect();
  const midX = (p1.x + p2.x) / 2 + (svgR.left - c.left);
  const midY = (p1.y + p2.y) / 2 + (svgR.top  - c.top);
  const label = addText({ x: midX, y: midY - 12, value: '0.0m' });
  label.style.fontSize = '16px';
  label.style.background = 'rgba(255,255,255,0.85)';
  label._pairedLine = line;
  label.addEventListener('dblclick', ()=> line.remove());

  toast('거리 라벨을 탭해 실측값을 입력하세요');
}

function clearMeasures(){
  svg.querySelectorAll('line[data-type="measure"]').forEach(l=> l.remove());
  document.querySelectorAll('.textbox').forEach(t=>{ if(t._pairedLine) t.remove(); });
  toast('측정선을 지웠습니다');
}

/* ===== PDF 파일명: 사고현장약도_YYYYMMDD_HHmm.pdf ===== */
function makeFilename(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `사고현장약도_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`
       + `_${p(d.getHours())}${p(d.getMinutes())}.pdf`;
}

/* 생성된 PDF 보관 (저장·공유 버튼에서 사용) */
let lastPdf = null;   // { blob, filename }

/* ===== PDF ===== */
async function savePDF(){

  // 지도 탐색 모드에서는 배경(실시간 지도)이 캡처되지 않음 → 먼저 확정
  if(mapDiv.classList.contains('navigating')){
    alert('먼저 배경(📷 스크린샷 또는 "현재 화면 배경")을 만든 뒤 PDF를 만드세요.');
    return;
  }

  toast('PDF 만드는 중…', 4000);

  /* 🔹 PDF 캡처 준비
     html2canvas 는 폼 요소(<input>)와 스크립트로 만든 인라인 <svg>(충돌지점 X,
     횡단보도)를 제대로 그리지 못한다. 캡처 직전에 같은 위치·크기의 정적 요소
     (div / img)로 잠시 대체하고, 캡처 후 원상복구한다.
     대체 요소는 정상 출력되는 아이콘들과 같은 좌표계(#objectLayer)에 넣는다. */
  const pdfTemp = [];     // 캡처 후 제거할 임시 노드
  const pdfHidden = [];    // 캡처 후 다시 보이게 할 원본

  function stageForPdf(orig, clone){
    const cs = getComputedStyle(orig);
    clone.style.position = 'absolute';
    clone.style.left = orig.style.left || ((parseFloat(cs.left) || 0) + 'px');
    clone.style.top  = orig.style.top  || ((parseFloat(cs.top)  || 0) + 'px');
    clone.style.transform = (cs.transform && cs.transform !== 'none') ? cs.transform : '';
    clone.style.transformOrigin = cs.transformOrigin;
    clone.style.zIndex = (cs.zIndex && cs.zIndex !== 'auto') ? cs.zIndex : '1000';
    objectLayer.appendChild(clone);
    orig.style.visibility = 'hidden';
    pdfTemp.push(clone);
    pdfHidden.push(orig);
  }

  // 문자(textbox input) → div
  document.querySelectorAll('#objectLayer .textbox').forEach(t=>{
    const cs = getComputedStyle(t);
    const div = document.createElement('div');
    div.textContent = t.value || '';
    div.style.font       = cs.font;
    div.style.fontSize   = cs.fontSize;
    div.style.fontFamily = cs.fontFamily;
    div.style.fontWeight = cs.fontWeight;
    div.style.lineHeight = cs.lineHeight;
    div.style.color      = '#000';
    div.style.background  = cs.backgroundColor;
    div.style.padding    = cs.padding;
    div.style.textAlign  = cs.textAlign;
    div.style.whiteSpace = 'nowrap';
    stageForPdf(t, div);
  });

  // 충돌지점 X · 횡단보도(인라인 svg) → 크기가 명시된 svg data-URI img
  document.querySelectorAll('#objectLayer .xmark, #objectLayer .crosswalk').forEach(el=>{
    const w = el.offsetWidth  || parseFloat(el.style.width)  || 48;
    const h = el.offsetHeight || parseFloat(el.style.height) || 48;
    const svgClone = el.cloneNode(true);
    svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    svgClone.setAttribute('width', w);
    svgClone.setAttribute('height', h);
    svgClone.removeAttribute('class');
    svgClone.removeAttribute('style');
    const xml = new XMLSerializer().serializeToString(svgClone);
    const img = document.createElement('img');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    img.width = w; img.height = h;
    img.style.width  = w + 'px';
    img.style.height = h + 'px';
    img.style.opacity = getComputedStyle(el).opacity;
    stageForPdf(el, img);
  });

  // 임시 img 디코딩 대기 (html2canvas 가 빈 이미지를 그리지 않도록)
  await Promise.all(pdfTemp
    .filter(n => n.tagName === 'IMG' && n.decode)
    .map(n => n.decode().catch(()=>{})));

  const canvasImg = await html2canvas(container, {
    useCORS: true,
    scale: 2,
    backgroundColor: '#ffffff',
    logging: false,
    ignoreElements: (el) => {
      return el.id === 'toolbox'  || el.closest('#toolbox')
          || el.id === 'panel'    || el.closest('#panel')
          || el.id === 'pdfResultBar' || el.id === 'toast'
          || (el.classList && el.classList.contains('leaflet-control-container'));
    }
  });

  // 🔹 원상복구
  pdfTemp.forEach(n => n.remove());
  pdfHidden.forEach(el => { el.style.visibility = 'visible'; });

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  // A4 페이지에 맞춰 비율 유지하며 중앙 배치
  let w = pw, h = canvasImg.height * pw / canvasImg.width;
  if(h > ph){ h = ph; w = canvasImg.width * ph / canvasImg.height; }
  const x = (pw - w) / 2, y = (ph - h) / 2;

  pdf.addImage(canvasImg.toDataURL('image/jpeg', 0.92), 'JPEG', x, y, w, h);

  const filename = makeFilename();
  lastPdf = { blob: pdf.output('blob'), filename };

  showPdfResult(filename);
  toast('PDF 생성 완료');
}

/* ===== PDF 결과 바 ===== */
function showPdfResult(filename){
  document.getElementById('pdfFname').textContent = filename;
  document.getElementById('pdfResultBar').style.display = 'block';
}

async function sharePDF(){
  if(!lastPdf){ toast('먼저 PDF를 만드세요'); return; }
  const file = new File([lastPdf.blob], lastPdf.filename, { type:'application/pdf' });

  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({
        files:[file],
        title:'교통사고 현장약도',
        text: lastPdf.filename
      });
    }catch(err){
      if(err && err.name === 'AbortError') return;   // 사용자가 공유창 취소
      downloadPDF();
      toast('공유를 사용할 수 없어 저장했습니다. 저장된 PDF를 첨부해 보내세요.', 4000);
    }
  }else{
    downloadPDF();
    toast('이 기기는 파일 공유를 지원하지 않습니다. 저장된 PDF를 첨부해 보내세요.', 4200);
  }
}

function downloadPDF(){
  if(!lastPdf){ toast('먼저 PDF를 만드세요'); return; }
  const url = URL.createObjectURL(lastPdf.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = lastPdf.filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

document.getElementById('pdfShareBtn').addEventListener('click', sharePDF);
document.getElementById('pdfSaveBtn').addEventListener('click', downloadPDF);

/* ========================================================= */
/* ===== 배경 위치잡기 지도 =====                             */
/*   KAKAO_JS_KEY 있으면 카카오맵(위치잡기 전용),              */
/*   없으면 OpenStreetMap(키 불필요, 화면 그대로 배경 가능)    */
/* ========================================================= */
let osmMapObj = null;
let osmTileLayer = null;
let kakaoMapObj = null;
let kakaoReady = false;

function setMapHint(text){
  document.getElementById('mapHint').textContent = text || '';
}

/* ---------- 지도 스타일 (OSM, 모두 키 불필요) ---------- */
const MAP_STYLES = {
  simple: {
    label: '심플 (도로·건물 위주)',
    url: 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
    options: { subdomains: 'abc', maxNativeZoom: 18, maxZoom: 26,
               attribution: '© OpenStreetMap 기여자, HOT' }
  },
  standard: {
    label: '표준 지도 (OSM)',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    options: { maxNativeZoom: 19, maxZoom: 26,
               attribution: '© OpenStreetMap 기여자' }
  },
  aerial: {
    label: '항공사진',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    options: { maxNativeZoom: 19, maxZoom: 26,
               attribution: '항공사진 © Esri' }
  }
};
let currentStyle = 'simple';

function setMapStyle(key){
  if(!MAP_STYLES[key] || !osmMapObj) return;
  currentStyle = key;
  if(osmTileLayer) osmMapObj.removeLayer(osmTileLayer);
  const s = MAP_STYLES[key];
  osmTileLayer = L.tileLayer(s.url, Object.assign(
    { crossOrigin: true },        // html2canvas 캡처를 위해 필요
    s.options
  )).addTo(osmMapObj);
  const sel = document.getElementById('mapStyleSel');
  if(sel && sel.value !== key) sel.value = key;
}

function initOsmMap(){
  if(osmMapObj) return osmMapObj;

  osmMapObj = L.map('osmMap', {
    center: [37.5665, 126.9780],   // 기본값: 서울시청
    zoom: 17,
    minZoom: 2,
    maxZoom: 26,
    zoomControl: true,
    attributionControl: false,
    scrollWheelZoom: true,        // PC: 마우스 휠로 확대/축소
    zoomSnap: 0.5,
    zoomDelta: 0.5,
    wheelPxPerZoomLevel: 60,      // Leaflet 기본값 (휠 한 번에 확실히 반응)
    doubleClickZoom: true,
    boxZoom: true,               // Shift+드래그로 영역 확대
    touchZoom: true,             // 모바일: 두 손가락 핀치 줌
    dragging: true,
    inertia: true,
    zoomAnimation: false,        // 캡처 정확도를 위해 끔(확대는 즉시 반영)
    fadeAnimation: false,
    markerZoomAnimation: false,
    bounceAtZoomLimits: false
  });

  L.control.scale({ imperial: false }).addTo(osmMapObj);
  setMapStyle(currentStyle);

  const sel = document.getElementById('mapStyleSel');
  if(sel && !sel.options.length){
    Object.keys(MAP_STYLES).forEach(k=>{
      const o = document.createElement('option');
      o.value = k;
      o.textContent = MAP_STYLES[k].label;
      sel.appendChild(o);
    });
    sel.value = currentStyle;
    sel.addEventListener('change', ()=> setMapStyle(sel.value));
  }
  return osmMapObj;
}

/* ---------- 카카오맵 (위치잡기 전용) ---------- */
function loadKakaoSdk(){
  return new Promise((resolve, reject)=>{
    if(window.kakao && window.kakao.maps && window.kakao.maps.Map) return resolve();
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey='
          + encodeURIComponent(KAKAO_JS_KEY)
          + '&autoload=false&libraries=services';
    s.onload = ()=> kakao.maps.load(resolve);
    s.onerror = ()=> reject(new Error('카카오맵 SDK 로드 실패 (JavaScript 키·도메인 등록 확인)'));
    document.head.appendChild(s);
  });
}

async function initKakaoMap(){
  if(kakaoReady) return kakaoMapObj;
  await loadKakaoSdk();

  kakaoMapObj = new kakao.maps.Map(document.getElementById('kakaoMap'), {
    center: new kakao.maps.LatLng(37.5665, 126.9780),
    level: 3
  });

  const sel = document.getElementById('mapStyleSel');
  if(sel){
    sel.innerHTML = '';
    [['ROADMAP','일반지도'], ['HYBRID','스카이뷰']].forEach(([v,l])=>{
      const o = document.createElement('option');
      o.value = v; o.textContent = l;
      sel.appendChild(o);
    });
    sel.value = 'ROADMAP';
    sel.onchange = ()=> kakaoMapObj.setMapTypeId(kakao.maps.MapTypeId[sel.value]);
  }

  kakaoReady = true;
  return kakaoMapObj;
}

/* ---------- 지도 탐색 모드 (프레임 안에서 WYSIWYG) ---------- */
/* 탐색 중에는 선·객체 레이어가 포인터 이벤트를 통과시켜 지도 드래그·확대가 되게 함 */
function setNavPointerPassthrough(on){
  const ll = document.getElementById('lineLayer');
  if(ll) ll.style.pointerEvents = on ? 'none' : '';
  document.querySelectorAll('#objectLayer .icon, #objectLayer .arrow, #objectLayer .textbox, .xmark, .crosswalk')
    .forEach(el => el.style.pointerEvents = on ? 'none' : '');
}

function refreshMapSize(){
  // 프레임이 반응형이라 표시 직후 크기 재계산 필요
  if(osmMapObj) osmMapObj.invalidateSize();
  if(kakaoMapObj && kakaoReady) kakaoMapObj.relayout();
}

function startOsmNav(){
  document.getElementById('confirmBgBtn').style.display = '';
  document.getElementById('kakaoMap').style.display = 'none';   // 빈 카카오 div가 이벤트 막지 않게
  document.getElementById('osmMap').style.display = 'block';
  setMapHint('지도를 드래그해 이동, 휠(또는 두 손가락)으로 확대·축소하여 사고 위치를 프레임에 맞추세요.');
  initOsmMap();
  setTimeout(refreshMapSize, 60);
  setTimeout(refreshMapSize, 300);
}

function openMapNav(){
  mapDiv.classList.add('navigating');
  toolContent.style.display = 'none';        // 도구 패널 접어 시야 확보
  setNavPointerPassthrough(true);

  if(USE_KAKAO){
    document.getElementById('confirmBgBtn').style.display = 'none';   // 카카오는 캡처 불가(정책·CORS)
    document.getElementById('osmMap').style.display = 'none';
    document.getElementById('kakaoMap').style.display = 'block';
    setMapHint('지도를 드래그·확대해 사고 위치를 프레임에 맞춘 뒤, 폰 스크린샷 → 📷 스크린샷.');
    initKakaoMap()
      .then(()=>{ setTimeout(refreshMapSize, 60); setTimeout(refreshMapSize, 300); })
      .catch(err=>{
        toast(err.message + ' — OSM 지도로 전환합니다.', 4500);
        startOsmNav();
      });
  }else{
    startOsmNav();
  }
}

/* ---------- 장소 검색 ---------- */
async function searchPlace(){
  const q = document.getElementById('placeSearch').value.trim();
  if(!q) return;

  // 카카오맵 모드
  if(USE_KAKAO && kakaoReady){
    const places = new kakao.maps.services.Places();
    places.keywordSearch(q, (data, status)=>{
      if(status === kakao.maps.services.Status.OK){
        kakaoMapObj.setCenter(new kakao.maps.LatLng(data[0].y, data[0].x));
        kakaoMapObj.setLevel(3);
      }else{
        new kakao.maps.services.Geocoder().addressSearch(q, (r, st)=>{
          if(st === kakao.maps.services.Status.OK){
            kakaoMapObj.setCenter(new kakao.maps.LatLng(r[0].y, r[0].x));
            kakaoMapObj.setLevel(3);
          }else{
            toast('검색 결과가 없습니다: ' + q);
          }
        });
      }
    });
    return;
  }

  // OSM 모드 (Nominatim, 키 불필요)
  try{
    const res = await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q='
      + encodeURIComponent(q)
    );
    const data = await res.json();
    if(!data.length){ toast('검색 결과가 없습니다: ' + q); return; }
    osmMapObj.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 18);
  }catch(err){
    toast('검색 실패: ' + err.message);
  }
}

    return;
  }
  const btn = document.getElementById('confirmBgBtn');
  btn.disabled = true;
  btn.textContent = '생성 중…';

  try{

      if(!osmTileLayer) return resolve();
      let done = false;
      const finish = ()=>{ if(!done){ done = true; resolve(); } };
      osmTileLayer.once('load', finish);
      setTimeout(finish, 1500);

    const canvas = await html2canvas(document.getElementById('osmMap'), {
      useCORS: true,
      scale: 2,
      backgroundColor: '#ffffff',
      logging: false,
      ignoreElements: (el)=> el.classList &&
        (el.classList.contains('leaflet-control-container') ||
         el.classList.contains('leaflet-control'))
    });

    bgMap.src = canvas.toDataURL('image/jpeg', 0.95);
    bgMap.style.objectFit = 'fill';

                     .replace(/<[^>]+>/g, ''));

          '\n폰 스크린샷을 찍어 "📷 스크린샷"으로 불러와 주세요.');
  }finally{

/* =========================================================================
   도로 자동 약도
   현재 지도 화면 범위의 도로·건물을 OpenStreetMap 벡터 데이터(Overpass)로
   가져와 약도(개념도)로 그려 배경에 넣는다.
   - 카카오/타 지도 이미지 미사용 → 이용정책 무관
   - 차량·충돌지점·화살표·거리 등은 이후 도구로 직접 배치
   ========================================================================= */
const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter'
];
const OVERPASS_TRIES = 2;          // 엔드포인트 목록을 몇 바퀴 시도할지
const OVERPASS_TIMEOUT = 15000;    // 한 요청 제한시간(ms)

/* 등급별 약도 도로폭(m) — 실제 폭이 아닌 단순화 값 */
const ROAD_M = {
  motorway:24, trunk:22, primary:18, secondary:15, tertiary:11,
  unclassified:8, residential:6, living_street:5, pedestrian:3,
  motorway_link:12, trunk_link:11, primary_link:10, secondary_link:9, tertiary_link:7
};
function roadRank(hw){
  const m = { motorway:5, trunk:5, primary:4, secondary:3, secondary_link:3,
              tertiary:2, tertiary_link:2, unclassified:1, residential:1,
              living_street:1, pedestrian:0 };
  return (hw in m) ? m[hw] : 1;
}

function currentMapBounds(){
  if(USE_KAKAO && kakaoReady && kakaoMapObj){
    const b = kakaoMapObj.getBounds();
    const sw = b.getSouthWest(), ne = b.getNorthEast();
    return { s: sw.getLat(), w: sw.getLng(), n: ne.getLat(), e: ne.getLng() };
  }
  if(osmMapObj){
    const b = osmMapObj.getBounds();
    return { s: b.getSouth(), w: b.getWest(), n: b.getNorth(), e: b.getEast() };
  }
  return null;
}

async function overpassFetch(query){
  let lastErr;
  for(let round = 0; round < OVERPASS_TRIES; round++){
    for(const url of OVERPASS_ENDPOINTS){
      try{
        const ctl = new AbortController();
        const timer = setTimeout(()=> ctl.abort(), OVERPASS_TIMEOUT);
        const res = await fetch(url, {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query),
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          signal: ctl.signal
        });
        clearTimeout(timer);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const txt = await res.text();
        if(txt.charAt(0) !== '{') throw new Error('지도 서버 혼잡');
        return JSON.parse(txt);
      }catch(err){ lastErr = err; }
    }
  }
  throw lastErr || new Error('Overpass 연결 실패');
}

async function generateRoadSchematic(){
  const btn = document.getElementById('autoMapBtn');
  const bnd = currentMapBounds();
  if(!bnd){ toast('먼저 지도를 여세요'); return; }

  const latC = (bnd.s + bnd.n)/2, lonC = (bnd.w + bnd.e)/2;
  const mPerLat = 110540, mPerLon = 111320 * Math.cos(latC * Math.PI/180);

  const halfH = (bnd.n - bnd.s) / 2 * mPerLat;
  const halfW = (bnd.e - bnd.w) / 2 * mPerLon;
  const PAD = 1.3;              // 가장자리 도로·라벨용 여유
  const MAX_HALF = 750;        // 한 변 최대 ~1.5km (과도한 요청 방지)

  // 그리기 기준 = 프레임에 보이는 실제 범위 (확대한 그대로 반영).
  // 단, 극단적으로 줌아웃한 경우만 MAX_HALF 로 제한해 빈 여백 방지.
  const dH = Math.min(halfH, MAX_HALF);
  const dW = Math.min(halfW, MAX_HALF);
  const drawGeo = {
    s: latC - dH/mPerLat, n: latC + dH/mPerLat,
    w: lonC - dW/mPerLon, e: lonC + dW/mPerLon,
    latC, lonC, mPerLat, mPerLon
  };

  // Overpass 요청 범위 = 그리기 범위 + 가장자리 여유
  const qH = Math.min(Math.max(dH * PAD, 18), MAX_HALF);
  const qW = Math.min(Math.max(dW * PAD, 18), MAX_HALF);
  const s = latC - qH/mPerLat, n = latC + qH/mPerLat;
  const w = lonC - qW/mPerLon, e = lonC + qW/mPerLon;

  const q =
'[out:json][timeout:25];\n(\n' +
'  way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|pedestrian|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"](' + s + ',' + w + ',' + n + ',' + e + ');\n' +
'  way["building"](' + s + ',' + w + ',' + n + ',' + e + ');\n' +
');\nout geom;';

  btn.disabled = true;
  const oldTxt = btn.textContent;
  btn.textContent = '불러오는 중…';
  toast('도로·건물 데이터 불러오는 중…', 8000);

  try{
    const data = await overpassFetch(q);
    drawSchematicFromOSM(data, drawGeo);   // 프레임에 보이는 범위 그대로 그림
    setBgAttribution('© OpenStreetMap 기여자 (ODbL)');
    closeMapNav();
    toast('도로 약도를 만들었습니다');
  }catch(err){
    // 지도창은 열어둔 채로 안내 (다시 시도하거나 다른 배경 방식 사용)
    toast('도로 약도 실패: ' + (err && err.message ? err.message : err)
          + ' · 잠시 후 다시 시도하거나 📷 스크린샷을 쓰세요', 5000);
  }finally{
    btn.disabled = false;
    btn.textContent = oldTxt;
  }
}

function drawSchematicFromOSM(data, geo){
  const r = mapDiv.getBoundingClientRect();
  const DPR = 2;
  const cw = Math.max(2, Math.round(r.width));
  const ch = Math.max(2, Math.round(r.height));
  const cv = document.createElement('canvas');
  cv.width = cw * DPR; cv.height = ch * DPR;
  const ctx = cv.getContext('2d');
  ctx.scale(DPR, DPR);

  // 투영: bbox를 프레임에 cover(등축척)로 맞춤
  const bboxWm = (geo.e - geo.w) * geo.mPerLon;
  const bboxHm = (geo.n - geo.s) * geo.mPerLat;
  const scale = Math.max(cw / bboxWm, ch / bboxHm);   // px / m
  function P(lat, lon){
    return [ (lon - geo.lonC) * geo.mPerLon * scale + cw/2,
             -(lat - geo.latC) * geo.mPerLat * scale + ch/2 ];
  }
  function offCanvas(pts){
    return pts.every(p => p[0] < -60 || p[0] > cw+60 || p[1] < -60 || p[1] > ch+60);
  }

  const els = data.elements || [];
  const buildings = [], roads = [];
  for(const el of els){
    if(el.type !== 'way' || !el.geometry) continue;
    const t = el.tags || {};
    if(t.building && t.building !== 'no') buildings.push(el);
    else if(t.highway) roads.push(el);
  }
  if(!roads.length) throw new Error('이 위치의 도로 데이터가 없습니다 (지도를 조금 이동/축소해 보세요)');
  roads.sort((a,b)=> roadRank(a.tags.highway) - roadRank(b.tags.highway));

  ctx.fillStyle = '#f7f7f4';
  ctx.fillRect(0, 0, cw, ch);

  // ---- 건물 ----
  ctx.lineWidth = 0.7;
  ctx.strokeStyle = '#d0d0c8';
  ctx.fillStyle = '#e7e7e1';
  for(const b of buildings){
    const pts = b.geometry.map(pt => P(pt.lat, pt.lon));
    if(pts.length < 3 || offCanvas(pts)) continue;
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function roadPx(hw){
    const m = ROAD_M[hw] || 5;
    // 실제 폭 기반이되, 프레임 대비 과도하지 않게 상한(프레임폭의 18%)
    return Math.max(3, Math.min(cw * 0.18, m * scale));
  }
  function trace(el){
    ctx.beginPath();
    el.geometry.forEach((pt,i)=>{
      const [x,y] = P(pt.lat, pt.lon);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
  }
  const visRoads = roads.filter(el => !offCanvas(el.geometry.map(pt => P(pt.lat, pt.lon))));

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // casing → fill → 중앙선
  for(const el of visRoads){ trace(el); ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = roadPx(el.tags.highway) + 3; ctx.stroke(); }
  for(const el of visRoads){ trace(el); ctx.strokeStyle = roadRank(el.tags.highway) >= 2 ? '#ffffff' : '#efefec'; ctx.lineWidth = roadPx(el.tags.highway); ctx.stroke(); }
  ctx.setLineDash([9,7]);
  for(const el of visRoads){
    if(roadRank(el.tags.highway) >= 2 && roadPx(el.tags.highway) >= 11){
      trace(el); ctx.strokeStyle = '#e5b100'; ctx.lineWidth = 1.6; ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  // ---- 도로명 라벨 ----
  const placed = [], seen = new Set();
  const majorFirst = visRoads.slice().sort((a,b)=> roadRank(b.tags.highway) - roadRank(a.tags.highway));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const el of majorFirst){
    const nm = el.tags.name;
    if(!nm || seen.has(nm) || roadRank(el.tags.highway) < 2) continue;
    let best = null;
    for(let i=0;i<el.geometry.length-1;i++){
      const [x1,y1] = P(el.geometry[i].lat, el.geometry[i].lon);
      const [x2,y2] = P(el.geometry[i+1].lat, el.geometry[i+1].lon);
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      if(mx < 10 || mx > cw-10 || my < 10 || my > ch-10) continue;
      const L = Math.hypot(x2-x1, y2-y1);
      if(!best || L > best.L) best = { L, x1,y1,x2,y2, mx, my };
    }
    if(!best || best.L < 60) continue;
    if(placed.some(p => Math.hypot(p.x-best.mx, p.y-best.my) < 64)) continue;
    let ang = Math.atan2(best.y2-best.y1, best.x2-best.x1);
    if(ang >  Math.PI/2) ang -= Math.PI;
    if(ang < -Math.PI/2) ang += Math.PI;
    ctx.save();
    ctx.translate(best.mx, best.my);
    ctx.rotate(ang);
    ctx.font = '700 13px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(nm, 0, 0);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillText(nm, 0, 0);
    ctx.restore();
    placed.push({ x: best.mx, y: best.my });
    seen.add(nm);
  }

  // 테두리 + 출처
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, cw-1, ch-1);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.font = '10px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillRect(cw-152, ch-15, 152, 15);
  ctx.fillStyle = '#333';
  ctx.fillText('© OpenStreetMap 기여자', cw-4, ch-3);

  bgMap.src = cv.toDataURL('image/jpeg', 0.92);
  bgMap.style.objectFit = 'fill';
}

document.getElementById('autoMapBtn').addEventListener('click', generateRoadSchematic);

/* ===== 선택 객체 속성 패널 슬라이더 이벤트 연결 ===== */
const angleInput    = document.getElementById('angle');
let lineRotateAnchor = 'start';   // 'start' = x1,y1 / 'end' = x2,y2
const sizeInput     = document.getElementById('size');
const fontSizeInput = document.getElementById('fontSize');
const widthInput    = document.getElementById('width');

angleInput.addEventListener('input', ()=> {
  if(!selected || selected === panel) return;

  // ===== 선일 경우 (끝점 기준 회전) =====
  if(selected.tagName === 'line'){
    const x1 = selected.x1.baseVal.value;
    const y1 = selected.y1.baseVal.value;
    const x2 = selected.x2.baseVal.value;
    const y2 = selected.y2.baseVal.value;

    const anchor =
      lineRotateAnchor === 'start'
        ? { x: x1, y: y1 }   // 좌측 끝점
        : { x: x2, y: y2 };  // 우측 끝점

    selected.style.transformOrigin =
      `${anchor.x}px ${anchor.y}px`;

    selected.style.transform =
      `rotate(${angleInput.value}deg)`;
  }
  // ===== 기존 객체(아이콘, 화살표, 문자) =====
  else{
    selected.style.transform =
      `rotate(${angleInput.value}deg)`;
  }
});

sizeInput.addEventListener('input', ()=> {
  if(!selected || selected === panel) return;
  const v = +sizeInput.value;
  selected.style.width = v + 'px';
  if(selected.tagName === 'IMG') selected.style.height = 'auto';
  if(selected.classList && selected.classList.contains('xmark'))
    selected.style.height = v + 'px';                         // X 는 정사각
  if(selected.classList && selected.classList.contains('crosswalk'))
    selected.style.height = (v * CROSSWALK_RATIO) + 'px';     // 횡단보도 비율 유지
});

fontSizeInput.addEventListener('input', ()=> {
  if(!selected) return;
  if(selected.tagName === 'INPUT') selected.style.fontSize = fontSizeInput.value + 'px';
});

widthInput.addEventListener('input', ()=> {
  if(!selected || selected === panel) return;

  if(selected.tagName === 'INPUT') {
    selected.style.width = widthInput.value + 'px';
  } else if(selected.classList.contains('arrow')) {
    selected.style.width = widthInput.value + 'px';
    selected.style.height = 'auto';
  } else if(selected.classList.contains('crosswalk')) {
    selected.style.width = widthInput.value + 'px';   // 도로 폭에 맞춰 가로만 늘림
  }
});

/* ===================================================== */
/* ===== + / - 자동 증감 버튼 (슬라이더 기능 재사용) ===== */
/* ===================================================== */

let stepTimer = null;

document.querySelectorAll('.stepBtn').forEach(btn=>{
  const targetId = btn.dataset.target;
  const step = parseFloat(btn.dataset.step);

  const start = ()=>{
    const input = document.getElementById(targetId);
    if(!input) return;

    const update = ()=>{
      let v = parseFloat(input.value) + step;
      v = Math.max(
        parseFloat(input.min),
        Math.min(parseFloat(input.max), v)
      );
      input.value = v;

      // ⭐ 기존 슬라이더 로직 100% 재사용
      input.dispatchEvent(new Event('input'));
    };

    update();                 // 즉시 1회
    stepTimer = setInterval(update, 80); // 길게 누르면 자동
  };

  const stop = ()=>{
    clearInterval(stepTimer);
    stepTimer = null;
  };

  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
});
